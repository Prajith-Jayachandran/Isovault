menuentry "1. Pre-Flight Hardware Health & Certification Audit" --class=debug_hwinfo --class=F5tool {    
    terminal_output console
    clear

    smbios -t 4 -s 0x10 --set=cpu_brand
    
    set system_vendor="-";
    smbios -t 1 -s 0x04 --set=system_vendor;
    set system_product="-";
    smbios -t 1 -s 0x05 --set=system_product;
    set system_version="-";
    smbios -t 1 -s 0x06 --set=system_version;
    set system_serial="-";
    smbios -t 1 -s 0x07 --set=system_serial;

    set board_vendor="-";
    smbios -t 2 -s 0x04 --set=board_vendor;
    set board_product="-";
    smbios -t 2 -s 0x05 --set=board_product;
    set board_version="-";
    smbios -t 2 -s 0x06 --set=board_version;

    set bios_vendor="-";
    smbios -t 0 -s 0x04 --set=bios_vendor;
    set bios_version="-";
    smbios -t 0 -s 0x05 --set=bios_ver;
    set bios_date="-";
    smbios -t 0 -s 0x08 --set=bios_date;
    set bios_size="-";
    smbios -t 0 -b 0x09 --set=bios_size;

    echo "========================================================================"
    echo "           ISOVAULT PRE-FLIGHT HARDWARE HEALTH AUDIT REPORT             "
    echo "========================================================================"
    echo ""
    echo "  [TARGET SYSTEM IDENTIFICATION]"
    echo "  System Manufacturer : $system_vendor"
    echo "  Product Model       : $system_product ($system_version)"
    echo "  System Serial Number: $system_serial"
    echo "  Motherboard Model   : $board_vendor $board_product ($board_version)"
    echo ""
    echo "  [FIRMWARE & SECURITY SPECIFICATIONS]"
    echo "  Firmware Interface  : $grub_cpu-$grub_platform"
    if [ "$grub_platform" != "pc" ]; then
        echo "  UEFI Specification  : $grub_uefi_version"
        if vt_check_secureboot_var; then
            echo "  Secure Boot State   : ENABLED (Enforce MOK / Microsoft PK)"
        else
            echo "  Secure Boot State   : DISABLED (Direct kernel loading supported)"
        fi
    fi
    echo "  BIOS Vendor / Date  : $bios_vendor v$bios_ver ($bios_date)"
    echo ""
    echo "  [PROCESSOR & MEMORY HEALTH CERTIFICATION]"
    echo "  CPU Model           : $cpu_brand"
    echo "  Physical System RAM : $grub_total_ram MB"

    if [ -n "$grub_total_ram" ]; then
        if [ $grub_total_ram -ge 4096 ]; then
            echo -e "  OS Compatibility    : \033[32m[PASS] Full Windows 11 & Heavyweight Linux Ready\033[0m"
        else
            echo -e "  OS Compatibility    : \033[33m[NOTICE] RAM < 4GB. Lightweight Distros Recommended\033[0m"
        fi
    fi
    echo ""
    echo "========================================================================"
    echo "  Audited by IsoVault 1.1.18 Hardware Profiler"
    echo "========================================================================"
    
    echo -en "\nPress ENTER to return to menu ..."
    read vtInputKey
    terminal_output gfxterm
}

menuentry "2. Air-Gapped Panic Telemetry (QR Code Display)" --class=debug_qr --class=F5tool {
    isovault_show_panic_qr
    echo -en "\nPress ENTER to return to menu ..."
    read vtInputKey
    terminal_output gfxterm
}

menuentry "3. Cloud Streams & Netboot Stubs Explorer" --class=debug_streams --class=F5tool {
    terminal_output console
    clear
    echo "========================================================================"
    echo "              ISOVAULT CLOUD STREAMS & NETBOOT REGISTRY                 "
    echo "========================================================================"
    echo ""
    echo "  Registered Cloud Streams on Partition 1 (/isovault/streams/):"
    echo ""
    for stream in (hd0,1)/isovault/streams/*.isostream (hd1,1)/isovault/streams/*.isostream (hd2,1)/isovault/streams/*.isostream; do
        if [ -f "$stream" ]; then
            echo "  • Found stream stub: $stream"
        fi
    done
    echo ""
    echo "  Standard Cloud Stream Profiles:"
    echo "  1. Alpine Linux 3.20 LTS (Direct HTTP RAM Boot)"
    echo "  2. Arch Linux Rolling Netboot (iPXE Cloud Stream)"
    echo "  3. Netboot.xyz Universal Cloud Bootloader (100+ OSs)"
    echo ""
    echo "  To register new streams, drop *.isostream files into /isovault/streams/"
    echo "========================================================================"
    echo -en "\nPress ENTER to return to menu ..."
    read vtInputKey
    terminal_output gfxterm
}

menuentry "4. Return to IsoVault Boot Menu" --class=cancel {
    configfile $prefix/grub.cfg
}
